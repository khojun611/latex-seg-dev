MODEL:
  META_ARCHITECTURE: "TextSemanticSegmentor"
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
    FREEZE_AT: 0
  RESNETS:
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  SEM_SEG_HEAD:
    NAME: "LaTeXSegHead"
    COARSE_HEAD_NAME: "TextSemSegFPNHead"
  IGR:
    IN_FEATURES: ["p2"]
    GDF_BAND: 0.005
    TRAIN_NUM_POINTS: 8192
    SUBDIVISION_STEPS: 2
    SUBDIVISION_NUM_POINTS: 20000
TEXT_CONSISTENCY:
  ENABLED: True
  NOTEXT_SEG_WEIGHT: 1.0
  SAFE_WEIGHT: 0.1
  HELP_WEIGHT: 0.5
  HELP_MARGIN: 0.2
  BUFFER: 64
  NEG_BATCH: 2
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.02
  STEPS: (60000, 80000)
  MAX_ITER: 90000
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
VERSION: 2
