_BASE_: Base-LaTeX-Seg-FPN.yaml

MODEL:
  # ImageNet pretrained ResNet-101부터 시작 (per-token cross-attention 텍스트조건)
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-101.pkl"
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
    FREEZE_AT: 0
  RESNETS:
    DEPTH: 101
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  SEM_SEG_HEAD:
    NUM_CLASSES: 2
  IGR:
    NUM_CLASSES: 2

DATASETS:
  TRAIN: ("HierText_sem_train",)
  TEST: ("HierText_sem_test",)

SOLVER:
  BASE_LR: 0.00003
  STEPS: (40000, 55000)
  MAX_ITER: 65000
  IMS_PER_BATCH: 8

INPUT:
  MIN_SIZE_TRAIN: (512, 768, 1024, 1280)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 1080
  MAX_SIZE_TRAIN: 2048
  MAX_SIZE_TEST: 2048
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: (512, 1024)
    SINGLE_CATEGORY_MAX_AREA: 0.75
  COLOR_AUG_SSD: True

DATALOADER:
  NUM_WORKERS: 8

OUTPUT_DIR: "./output_r101_hiertext"
