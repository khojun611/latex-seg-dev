_BASE_: latexseg_DINOv3_ViTB16_SFP_textseg.yaml

MODEL:
  # frozen DINOv3 ViT-L/16 + Hi-SAM adapters (every block). Text injected into one global-attention block per
  # cue as Hi-SAM --pv_blocks 11,17,22 (location, style, semantic), and each block's output feeds its Hi-SAM head:
  # location -> text region, style -> [glyph SDF, word SDF], semantic -> skeleton (MODEL.ROLE_HEADS).
  DINOV3:
    ARCH: "vitl16"
    WEIGHTS: "dinov3-vitl16-pretrain-lvd1689m"  # HF model directory (gated) or official .pth
    FREEZE: True
    ADAPTERS: True
    GRAD_CHECKPOINT: True
  TEXT_INJECTION:
    LOCATION: "backbone"
    NUM_BLOCKS: 3
    BLOCKS: (11, 17, 22)
  ROLE_HEADS:
    ENABLED: True
    REGION_WEIGHT: 1.0
    SDF_WEIGHT: 0.5
    SKEL_WEIGHT: 0.5

SOLVER:
  BASE_LR: 0.00005
  STEPS: (25000, 35000)
  MAX_ITER: 40000
  CHECKPOINT_PERIOD: 2500
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 1.0
    NORM_TYPE: 2.0

TEST:
  EVAL_PERIOD: 10000

OUTPUT_DIR: "./output_dinov3_vitl16_hisamroles_textseg"
